name: Debug APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Patch Mail.ru Android login flow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("OpenFlux/transport/mailru/mailru.go")
          s = p.read_text()

          old_struct = '''\t// cookiesApplied wakes a scheduled reconnect's wait early. Unbuffered on
          \t// purpose: a send only succeeds while such a wait is in progress.
          \tcookiesApplied chan struct{}
          }'''

          new_struct = '''\t// cookiesApplied wakes a scheduled reconnect's wait early. Unbuffered on
          \t// purpose: a send only succeeds while such a wait is in progress.
          \tcookiesApplied chan struct{}

          \tnotifyMu sync.Mutex
          \tnotify   func(error, string, string, string, string)
          }'''

          if old_struct not in s:
              raise SystemExit("MailruDocsTransport struct marker not found")
          s = s.replace(old_struct, new_struct, 1)

          marker = '''func (t *MailruDocsTransport) Start() error {'''

          methods = '''func (t *MailruDocsTransport) SetErrorNotifier(fn func(error, string, string, string, string)) {
          \tt.notifyMu.Lock()
          \tt.notify = fn
          \tt.notifyMu.Unlock()
          }

          func (t *MailruDocsTransport) notifyLoginRequired(err error) {
          \tt.notifyMu.Lock()
          \tfn := t.notify
          \tt.notifyMu.Unlock()
          \tif fn != nil {
          \t\tfn(err, "mailru", "https://cloud.mail.ru/", "", "login")
          \t}
          }

          '''

          if marker not in s:
              raise SystemExit("Start marker not found")
          s = s.replace(marker, methods + marker, 1)

          old_error = '''\t\t\tif errors.Is(err, ErrAnonymousForbidden) {
          \t\t\t\tif utils.Throttled("m-docs.anonymous", 10*time.Minute) {'''

          new_error = '''\t\t\tif errors.Is(err, ErrAnonymousForbidden) {
          \t\t\t\tt.notifyLoginRequired(err)
          \t\t\t\tif utils.Throttled("m-docs.anonymous", 10*time.Minute) {'''

          if old_error not in s:
              raise SystemExit("anonymous error block not found")
          s = s.replace(old_error, new_error, 1)

          p.write_text(s)

          print("Mail.ru Android login patch applied")
          PY

          grep -n -A8 -B3 'notifyLoginRequired' OpenFlux/transport/mailru/mailru.go

      - name: Build core
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-android-core.sh

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openflux-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
